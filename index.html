<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>种鸡区生产报表助手</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#20332b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:#176b52;color:white;padding:20px 16px}h1{font-size:22px;margin:0 0 6px}header p{margin:0;font-size:13px;opacity:.9}main{max-width:1000px;margin:18px auto;padding:0 13px}.box{background:#fff;border:1px solid #dce5df;border-radius:14px;padding:16px;margin-bottom:14px}.muted{color:#708078;font-size:13px;line-height:1.6}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:9px;background:#176b52;color:#fff;padding:11px 15px;font-size:14px;font-weight:600}button.alt{background:#e8f1ed;color:#176b52}button:disabled{opacity:.45}.barns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.barnbtn{background:white;color:#176b52;border:1px solid #c9ddd2;padding:18px 10px;font-size:17px}.barnbtn small{display:block;font-size:11px;color:#77877e;margin-top:5px;font-weight:400}.hidden{display:none}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.field label{display:block;font-size:12px;color:#66766d;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #cfdbd4;border-radius:8px;font-size:15px}.field.full{grid-column:1/-1}.metric{background:#edf6f1;border-radius:9px;padding:12px;margin-top:12px;font-size:13px}.metric b{color:#176b52}.status{font-size:13px;color:#176b52;margin-top:10px;white-space:pre-wrap}@media(max-width:480px){.fields{gap:8px}.box{padding:13px}}
</style></head><body><header><h1>种鸡区生产报表助手</h1><p>每栋鸡舍独立入口 · 每日数据逐日累积 · 手动确认后生成 Excel 日报</p></header><main>
<section class="box"><h3>导入原始 Excel</h3><div class="row"><input id="file" type="file" accept=".xlsx"><button id="load">读取 Excel</button></div><div id="loadMsg" class="status">先导入你现有的种鸡生产日报 Excel。</div><p class="muted">建议每天从上一次导出的最新 Excel 继续导入。当天数据不会自动生成；你逐栋填写并保存后，再点击“生成当日表格”。</p></section>
<section id="work" class="hidden">
<div class="box"><div class="row"><label>本次日报日期　<input id="day" type="date"></label><span id="prev" class="muted"></span></div><h3>选择鸡舍独立入口</h3><div id="barnList" class="barns"></div></div>
<section id="detail" class="box hidden"><div class="row"><button class="alt" id="back">← 返回鸡舍列表</button><h3 id="barnTitle" style="margin:0"></h3></div><div id="base" class="muted"></div>
<div class="fields">
<div class="field"><label>公鸡增加数量（只）</label><input id="addM" type="number" min="0" value="0"></div><div class="field"><label>公鸡减少数量（只）</label><input id="subM" type="number" min="0" value="0"></div>
<div class="field"><label>母鸡增加数量（只）</label><input id="addF" type="number" min="0" value="0"></div><div class="field"><label>母鸡减少数量（只）</label><input id="subF" type="number" min="0" value="0"></div>
<div class="field"><label>公鸡死亡（只）</label><input id="deadM" type="number" min="0" value="0"></div><div class="field"><label>母鸡死亡（只）</label><input id="deadF" type="number" min="0" value="0"></div>
<div class="field"><label>公鸡淘汰（只）</label><input id="cullM" type="number" min="0" value="0"></div><div class="field"><label>母鸡淘汰（只）</label><input id="cullF" type="number" min="0" value="0"></div>
<div class="field"><label>公鸡耗料（kg）</label><input id="feedM" type="number" min="0" step=".01"></div><div class="field"><label>母鸡耗料（kg）</label><input id="feedF" type="number" min="0" step=".01"></div>
<div class="field"><label>产蛋数（枚）</label><input id="eggs" type="number" min="0"></div><div class="field"><label>破蛋数（个）</label><input id="broken" type="number" min="0" value="0"></div>
<div class="field full"><label>疫苗接种情况（写入备注）</label><input id="vaccine" placeholder="例如：H5+7辽宁"></div><div class="field full"><label>转群情况（写入备注）</label><textarea id="transfer" rows="2" placeholder="例如：转入公鸡50只，转出母鸡100只"></textarea></div>
</div><div class="metric" id="calc">填写数据后显示当日存栏、耗料及产蛋率。</div><div class="row" style="margin-top:13px"><button id="save">保存本栋当日数据</button><span id="saved" class="muted"></span></div></section>
<section class="box"><h3>当日录入进度</h3><div id="progress" class="muted">尚未录入</div><div class="row" style="margin-top:14px"><button id="export" disabled>生成当日表格并下载 Excel</button></div><div id="exportMsg" class="status"></div></section></section></main>
<script>
let wb,ws,latestStart=1,latestDate,barns=[],active=null,latestRows={};
const $=x=>document.getElementById(x),num=x=>Math.max(0,Number(x)||0),v=x=>x==null?'':x;
const key=()=>`breederDaily_${$('day').value}`;
function dateVal(x){if(x instanceof Date)return x;if(typeof x==='number')return new Date(Date.UTC(1899,11,30)+x*86400000);return null}
function readCell(row,c){let x=row.getCell(c).value;if(x&&typeof x==='object'&&x.result!==undefined)return x.result;return x}
$('load').onclick=async()=>{let f=$('file').files[0];if(!f)return alert('请先选择 Excel 文件');try{wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());ws=wb.worksheets[0];let starts=[];for(let r=1;r<=ws.rowCount;r++)if(ws.getRow(r).getCell(1).value==='生产日报表')starts.push(r);if(!starts.length)throw Error('找不到生产日报表');latestStart=starts.at(-1);let drow=ws.getRow(latestStart+1);latestDate=dateVal(readCell(drow,11));let first=latestStart+4,last=latestStart+22;barns=[];latestRows={};for(let r=first;r<=last;r++){let row=ws.getRow(r),name=readCell(row,1);if(!name||String(name)==='死淘总数')continue;let b={name:String(name),batch:v(readCell(row,2)),breed:v(readCell(row,3)),age:Number(readCell(row,4))||0,male:Number(readCell(row,5))||0,female:Number(readCell(row,6))||0,feedM:readCell(row,11),feedF:readCell(row,12),eggs:Number(readCell(row,15))||0,rate:Number(readCell(row,16))||0,row:r};barns.push(b);latestRows[b.name]=b}if(!barns.length)throw Error('未识别到鸡舍');$('work').classList.remove('hidden');$('loadMsg').textContent=`读取成功：${f.name}，共 ${barns.length} 栋鸡舍。`;let next=new Date(latestDate||Date.now());next.setDate(next.getDate()+1);$('day').value=next.toISOString().slice(0,10);$('prev').textContent=`上一日报表日期：${latestDate?latestDate.toLocaleDateString(): '未知'}`;renderList();updateProgress()}catch(e){alert('读取失败：'+e.message)}};
function records(){try{return JSON.parse(localStorage.getItem(key())||'{}')}catch{return {}}}
function renderList(){let rec=records();$('barnList').innerHTML='';barns.forEach(b=>{let btn=document.createElement('button');btn.className='barnbtn';btn.innerHTML=`${b.name}<small>${rec[b.name]?'✓ 已保存':'点击进入录入'}</small>`;btn.onclick=()=>openBarn(b.name);$('barnList').appendChild(btn)})}
function openBarn(name){active=barns.find(b=>b.name===name);$('detail').classList.remove('hidden');$('barnTitle').textContent=active.name+' 鸡舍';let rec=records()[name]||{};$('base').textContent=`批号 ${active.batch}｜品种 ${active.breed}｜上一日日龄 ${active.age}｜上一日公鸡 ${active.male} 只｜母鸡 ${active.female} 只｜上一日产蛋率 ${active.rate.toFixed(2)}%`;
['addM','subM','addF','subF','deadM','deadF','cullM','cullF','feedM','feedF','eggs','broken','vaccine','transfer'].forEach(id=>$(id).value=rec[id]??(id==='broken'||id.startsWith('add')||id.startsWith('sub')||id.startsWith('dead')||id.startsWith('cull')?'0':''));calc();$('saved').textContent=rec.saved?'本日数据已保存，可再次修改':''}
function getData(){let o={};['addM','subM','addF','subF','deadM','deadF','cullM','cullF','feedM','feedF','eggs','broken','vaccine','transfer'].forEach(id=>o[id]=$(id).value);return o}
function computed(){let x=getData(),m=active.male+num(x.addM)-num(x.subM)-num(x.deadM)-num(x.cullM),f=active.female+num(x.addF)-num(x.subF)-num(x.deadF)-num(x.cullF),rate=f>0&&x.eggs!==''?num(x.eggs)/f*100:0;return {x,m,f,rate,delta:rate-active.rate}}
function calc(){if(!active)return;let c=computed();$('calc').innerHTML=`当日公鸡存栏：<b>${c.m}</b> 只　母鸡存栏：<b>${c.f}</b> 只<br>当日产蛋率：<b>${c.rate.toFixed(2)}%</b>　较上一日：<b>${c.delta>=0?'上升':'下降'} ${Math.abs(c.delta).toFixed(2)}</b> 个百分点<br>公鸡耗料：<b>${$('feedM').value||'—'}</b> kg　母鸡耗料：<b>${$('feedF').value||'—'}</b> kg`}
$('detail').addEventListener('input',calc);$('back').onclick=()=>{$('detail').classList.add('hidden');renderList()};
$('save').onclick=()=>{let all=records();all[active.name]={...getData(),saved:true};localStorage.setItem(key(),JSON.stringify(all));$('saved').textContent='已保存本栋当日数据（可再次进入修改）';renderList();updateProgress()};
function updateProgress(){let n=Object.keys(records()).length;$('progress').textContent=`已保存 ${n}/${barns.length} 栋。各栋数据分别保存，录入可以分多次完成。`; $('export').disabled=!wb||n===0}
$('day').addEventListener('change',()=>{renderList();updateProgress();if(active)$('detail').classList.add('hidden')});
$('export').onclick=async()=>{try{let data=records(),day=$('day').value;if(!day)throw Error('请先选择日期');let start=ws.rowCount+1,template=latestStart,rows=23;for(let off=0;off<rows;off++){let src=ws.getRow(template+off),dst=ws.getRow(start+off);dst.height=src.height;for(let c=1;c<=18;c++){let a=src.getCell(c),z=dst.getCell(c);z.value=a.value;z.style=structuredClone(a.style||{});z.numFmt=a.numFmt}}
let serial=(Date.UTC(...day.split('-').map((x,i)=>i===1?Number(x)-1:Number(x)))-Date.UTC(1899,11,30))/86400000;ws.getRow(start+1).getCell(11).value=serial;
barns.forEach((b,i)=>{let r=start+4+i,row=ws.getRow(r),d=data[b.name]||{},m=b.male+num(d.addM)-num(d.subM)-num(d.deadM)-num(d.cullM),f=b.female+num(d.addF)-num(d.subF)-num(d.deadF)-num(d.cullF);row.getCell(1).value=b.name;row.getCell(2).value=b.batch;row.getCell(3).value=b.breed;row.getCell(4).value=b.age+1;row.getCell(5).value=m;row.getCell(6).value=f;row.getCell(7).value=num(d.deadM)||null;row.getCell(8).value=num(d.deadF)||null;row.getCell(9).value=num(d.cullM)||null;row.getCell(10).value=num(d.cullF)||null;row.getCell(11).value=d.feedM===''?null:num(d.feedM);row.getCell(12).value=d.feedF===''?null:num(d.feedF);row.getCell(13).value=m&&d.feedM!==''?num(d.feedM)/m*1000:null;row.getCell(14).value=f&&d.feedF!==''?num(d.feedF)/f*1000:null;row.getCell(15).value=d.eggs===''?null:num(d.eggs);row.getCell(16).value=f&&d.eggs!==''?num(d.eggs)/f*100:null;row.getCell(17).value=f&&d.eggs!==''?num(d.eggs)/f*100-b.rate:null;let notes=[];if(num(d.broken))notes.push(`破蛋${num(d.broken)}个`);if(d.vaccine?.trim())notes.push('疫苗：'+d.vaccine.trim());if(d.transfer?.trim())notes.push('转群：'+d.transfer.trim());row.getCell(18).value=notes.join('；')||null;});
let total=ws.getRow(start+22);total.getCell(1).value='死淘总数';total.getCell(7).value=`=SUM(G${start+4}:H${start+21})`;total.getCell(9).value=`=SUM(I${start+4}:J${start+21})`;
let buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='种鸡生产日报_'+day+'.xlsx';a.click();$('exportMsg').textContent='当日表格已生成并下载。请将下载后的 Excel 作为下一日导入的基础文件。';}catch(e){$('exportMsg').textContent='生成失败：'+e.message}}
</script></body></html>
